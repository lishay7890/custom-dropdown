<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Dropdown</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Custom Dropdown</h1>

        <div class="dropdown">

            <button
                class="dropdown-button"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
            >
                <span class="dropdown-placeholder">
                    Select an option
                </span>

                <span class="dropdown-arrow" aria-hidden="true">
                    ▼
                </span>
            </button>

            <ul
                class="dropdown-menu"
                role="listbox"
                aria-label="Available options"
            >
                <li
                    class="dropdown-option"
                    role="option"
                    data-value="Pakistan"
                >
                    Pakistan
                </li>

                <li
                    class="dropdown-option"
                    role="option"
                    data-value="India"
                >
                    India
                </li>

                <li
                    class="dropdown-option"
                    role="option"
                    data-value="Turkey"
                >
                    Turkey
                </li>

                <li
                    class="dropdown-option"
                    role="option"
                    data-value="Canada"
                >
                    Canada
                </li>

                <li
                    class="dropdown-option"
                    role="option"
                    data-value="United Kingdom"
                >
                    United Kingdom
                </li>
            </ul>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
