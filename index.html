<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Custom Dropdown</h1>

        <div class="dropdown">

            <button class="dropdown-button" type="button">
                <span class="dropdown-placeholder">Select an option</span>
                <span class="dropdown-arrow">▼</span>
            </button>

            <ul class="dropdown-menu">
                <li class="dropdown-option">Pakistan</li>
                <li class="dropdown-option">India</li>
                <li class="dropdown-option">Turkey</li>
                <li class="dropdown-option">Canada</li>
                <li class="dropdown-option">United Kingdom</li>
            </ul>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
